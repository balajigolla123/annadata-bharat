<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Fertilizer & Irrigation Calculator</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <style>
    body.login-body {
      background: linear-gradient(120deg, #e8f5e9 0%, #fffde7 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 10px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      margin: 20px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(44, 62, 80, 0.12);
      padding: 32px 28px;
    }
    .app-logo {
      height: 60px;
      width: auto;
      display: block;
      margin: 0 auto 12px auto;
    }
    .login-title {
      text-align: center;
      font-size: 1.8rem;
      color: #2e7d32;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .login-subtitle {
      text-align: center;
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 22px;
    }
    .form-card {
      background: #f9fbe7;
      border: 1px solid #dcedc8;
      border-radius: 12px;
      padding: 22px 20px;
      margin-top: 10px;
    }
    .form-header-title {
      color: #2e7d32;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      font-weight: 600;
      color: #333;
      display: block;
      margin-bottom: 6px;
      font-size: 0.92rem;
    }
    .form-group input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid #cfd8dc;
      font-size: 1rem;
      background: #fff;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: #388e3c;
      box-shadow: 0 0 0 3px rgba(56, 142, 60, 0.15);
      outline: none;
    }
    .login-btn {
      width: 100%;
      padding: 13px;
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .login-btn:hover {
      background: #1b5e20;
    }
    .login-btn:active {
      transform: scale(0.99);
    }
    .switch-link {
      color: #2e7d32;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }
    .switch-link:hover {
      color: #1b5e20;
    }
    .switch-container {
      text-align: center;
      margin-top: 16px;
      font-size: 0.92rem;
      color: #555;
    }
    .language-select {
      display: block;
      margin: 0 auto 16px auto;
      border-radius: 6px;
      padding: 6px 12px;
      border: 1px solid #cfd8dc;
      background: #fff;
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="login-body">
  
  <div class="login-container">
    <img src="assets/logo.png" alt="Annadata Bharat logo" class="app-logo">
    
    <select id="languageSelect" class="language-select" aria-label="Select language">
      <option value="en">English</option>
      <option value="hi">Hindi</option>
      <option value="bn">Bengali</option>
      <option value="te">Telugu</option>
      <option value="mr">Marathi</option>
      <option value="ta">Tamil</option>
      <option value="ur">Urdu</option>
      <option value="gu">Gujarati</option>
      <option value="kn">Kannada</option>
      <option value="ml">Malayalam</option>
      <option value="or">Odia</option>
      <option value="pa">Punjabi</option>
    </select>

    <h1 class="login-title" data-i18n="main_title">🌾 Agriculture Calculator</h1>
    <p class="login-subtitle" data-i18n="main_subtitle">Smart Fertilizer & Irrigation Recommendation System</p>

    <!-- 1. LOGIN FORM (Default) -->
    <div id="loginFormCard" class="form-card">
      <div class="form-header-title">🔑 Farmer Login</div>
      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label for="loginUsername">Username or Mobile Number <span style="color:red">*</span></label>
          <input type="text" id="loginUsername" placeholder="e.g. balaji or 9876543210" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password <span style="color:red">*</span></label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-btn">Log In</button>
      </form>
      <div class="switch-container">
        <span>Don't have an account?</span>
        &nbsp;
        <span class="switch-link" onclick="showSignUpForm()">Sign Up / Create Account</span>
      </div>
    </div>

    <!-- 2. SIGN UP / CREATE ACCOUNT FORM -->
    <div id="signUpFormCard" class="form-card" style="display:none;">
      <div class="form-header-title">🌱 Create Farmer Account</div>
      <form id="signUpForm" onsubmit="handleSignUpSubmit(event)">
        <div class="form-group">
          <label for="regName">Full Name <span style="color:red">*</span></label>
          <input type="text" id="regName" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="regUsername">Username <span style="color:red">*</span></label>
          <input type="text" id="regUsername" placeholder="Choose a unique username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="regPhone">Mobile Number (10 Digits)</label>
          <input type="tel" id="regPhone" placeholder="e.g. 9876543210" maxlength="10" pattern="[0-9]{10}">
        </div>
        <div class="form-group">
          <label for="regPincode">Pincode (Optional)</label>
          <input type="text" id="regPincode" placeholder="e.g. 500081" maxlength="6">
        </div>
        <div class="form-group">
          <label for="regPassword">Create Password <span style="color:red">*</span></label>
          <input type="password" id="regPassword" placeholder="Min 4 characters" required minlength="4" autocomplete="new-password">
        </div>
        <button type="submit" class="login-btn">Create Account & Sign In</button>
      </form>
      <div class="switch-container">
        <span>Already have an account?</span>
        &nbsp;
        <span class="switch-link" onclick="showLoginForm()">Log In here</span>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
  <script>
    // Persist language selection and apply translation
    const langSelect = document.getElementById('languageSelect');
    const savedLang = localStorage.getItem('selectedLanguage');
    if (savedLang) langSelect.value = savedLang;
    langSelect.addEventListener('change', function() {
      localStorage.setItem('selectedLanguage', langSelect.value);
      if (window.i18n) window.i18n.set(langSelect.value);
    });
  </script>
</body>
</html>
